vowels:
  َ: фатха (короткое «а»)
  ِ: кясра (короткое «и»)
  ُ: дамма (короткое «у»)
  ا: мадд — долгое «аа»
  ۦ: мадд — долгое «ии»
  ۥ: мадд — долгое «уу»
  ڇ: калькаля — лёгкий «отскок» звука
letter_tips:
  ء: Короткое «а» с лёгкой смычкой в горле, как «а» после паузы.
  ب: Обычное «б».
  ت: "Мягкое «т»: кончик языка у верхних зубов."
  ث: "Межзубный звук: кончик языка между зубами, как английское th в «think»."
  ج: Слитное «дж».
  ح: "Глубокое «х» из середины горла: сожми горло и выдохни сильно, без хрипа."
  خ: Хриплое «х» из задней части нёба, как немецкое ch в «Bach». Буква твёрдая — звучит «хо».
  د: Обычное «д».
  ذ: "Межзубный звонкий звук: язык между зубами, как английское th в «this»."
  ر: Раскатистое «р». С фатхой буква твёрдая — «ро».
  ز: Обычное «з».
  س: Обычное мягкое «с».
  ش: Мягкое «ш».
  ص: "Твёрдое «с»: корень языка поднят, рот слегка округлён — «со»."
  ض: "Твёрдое «д»: боковой край языка прижат к коренным зубам — «до»."
  ط: "Твёрдое «т»: язык прижат к нёбу всей спинкой — «то»."
  ظ: "Твёрдый межзубный звук: язык между зубами, рот округлён — «зо»."
  ع: "Звук из середины горла: сожми горло и скажи «а» с напряжением."
  غ: Картавое «г», как французское r. Буква твёрдая — «го».
  ف: Обычное «ф».
  ق: Глубокое «к» корнем языка у мягкого нёба — «ко». Не путать с обычным «к» (ك).
  ك: Обычное мягкое «к».
  ل: Мягкое «л», как в «ля».
  م: Обычное «м».
  ن: Обычное «н».
  و: Губы округлены, как английское w.
  ه: Лёгкий выдох, как английское h в «hello».
  ي: Как «я» — «йа».
pair_tips:
- pair: حه
  tip: ح (х̣) — из середины горла, сильное и напряжённое; ه (һ) — лёгкий выдох из глубины груди.
- pair: حخ
  tip: ح — чистый выдох без хрипа; خ — с хрипом, как при полоскании горла.
- pair: ءع
  tip: ع — горло сжато и звук тянется; ء — короткая смычка, как пауза перед «а».
- pair: سص
  tip: ص — твёрдое «со» (корень языка поднят); س — мягкое «са».
- pair: دض
  tip: ض — твёрдое, боковой край языка к коренным зубам; د — обычное «д».
- pair: تط
  tip: ط — твёрдое «то», язык прижат к нёбу; ت — мягкое «та».
- pair: ذظ
  tip: ظ — твёрдое межзубное «зо»; ذ — мягкое межзубное, как th в «this».
- pair: ذز
  tip: ذ — язык между зубами (th); ز — обычное «з», язык за зубами.
- pair: زظ
  tip: ظ — язык между зубами и рот округлён; ز — обычное «з».
- pair: ثس
  tip: ث — язык между зубами (th в «think»); س — обычное «с».
- pair: قك
  tip: ق — глубоко, корнем языка («ко»); ك — обычное «к» ближе к передней части рта.
- pair: خغ
  tip: غ — звонкое картавое «г»; خ — глухое хриплое «х».
- pair: رغ
  tip: غ — из горла (французское r); ر — кончиком языка.
# Транскрипция «как читается» и «что прозвучало» (FR-21, FR-43, M-10).
# По научной русской транскрипции Крачковского (SRC-051), упрощённой для новичка: долгий гласный —
# двумя буквами («аа»), а не с чертой. Утверждено автором 2026-10-17; сверить с преподавателем (TD-FN-30).
# Точка снизу — твёрдый или горловой звук, черта снизу — язык между зубами.
transcription:
  ء: "’"
  ب: б
  ت: т
  ث: "с̱"
  ج: дж
  ح: "х̣"
  خ: х
  د: д
  ذ: "з̱"
  ر: р
  ز: з
  س: с
  ش: ш
  ص: "с̣"
  ض: "д̣"
  ط: "т̣"
  ظ: "з̣"
  ع: "‘"
  غ: "г̣"
  ف: ф
  ق: "к̣"
  ك: к
  ل: л
  م: м
  ن: н
  ه: һ
  و: ў
  ي: й
  َ: а
  ِ: и
  ُ: у
  ا: а
  ۦ: и
  ۥ: у
  ڇ: ""
  ْ: ""            # сукун: в фонемах модели его нет, встречается в тексте карточки
  ۪: э             # ималя: «а» ближе к «э»
  ـ: э             # долгая ималя
  ٲ: "’"           # облегчённая хамза
  ں: "н̃"           # скрытый нун (ихфа) — в нос
  ۾: "м̃"           # скрытый мим (ихфа) — в нос
  ۜ: "|"           # сакт: короткая пауза без вдоха
  ؙ: у             # краткая дамма
  آ: а
# Подсказка к значкам транскрипции: ключ — значки через пробел, в строке показываются
# только те из них, что есть в тексте («х̣ — из горла…», без лишних с̣ т̣ д̣ з̣).
transcription_legend:
  "с̣ т̣ д̣ з̣": "твёрдый звук (точка снизу)"
  "х̣ к̣ г̣": "из горла, глубоко (точка снизу)"
  "с̱ з̱": "кончик языка между зубами (черта снизу)"
  "‘": "айн: звук из середины горла, горло сжато"
  "’": "хамза: короткая пауза-смычка в горле"
  "һ": "лёгкий выдох, как английское h"
  "ў": "губы трубочкой, как английское w"
  "н̃ м̃": "звук в нос (ихфа)"
  "|": "короткая пауза без вдоха (сакт)"
# Как держать рот для гласных (FR-43). Утверждено автором 2026-10-17; сверить с преподавателем.
vowel_tips:
  َ: "Фатха — короткое «а»: открой рот и скажи «а» коротко. После твёрдых букв (ص ض ط ظ ق غ خ) «а» звучит ближе к «о»."
  ِ: "Кясра — короткое «и»: растяни губы, как в улыбке, и скажи «и» коротко."
  ُ: "Дамма — короткое «у»: губы трубочкой, скажи «у» коротко."
  ا: "Долгое «аа»: открой рот и тяни «а» в два раза дольше, на счёт «раз-два»."
  ۦ: "Долгое «ии»: губы в улыбке, тяни «и» в два раза дольше, на счёт «раз-два»."
  ۥ: "Долгое «уу»: губы трубочкой, тяни «у» в два раза дольше, на счёт «раз-два»."
