vowels:
  َ: fatha (short «a»)
  ِ: kasra (short «i»)
  ُ: damma (short «u»)
  ا: madd — long «aa»
  ۦ: madd — long «ii»
  ۥ: madd — long «uu»
  ڇ: qalqala — a light «bounce» of the sound
letter_tips:
  ء: A short «a» with a light catch in the throat, like «a» after a pause.
  ب: A plain «b».
  ت: "A light «t»: tip of the tongue at the upper teeth."
  ث: Between the teeth, like «th» in «think».
  ج: A smooth «j» as in «jam».
  ح: "A deep «h» from the middle of the throat: tighten the throat and breathe out strongly, without rasping."
  خ: A rasping «kh» from the back of the palate, like German «ch» in «Bach». Heavy letter.
  د: A plain «d».
  ذ: Voiced, between the teeth, like «th» in «this».
  ر: A rolled «r». With fatha it is heavy.
  ز: A plain «z».
  س: A plain light «s».
  ش: «sh».
  ص: "A heavy «s»: back of the tongue raised, lips slightly rounded."
  ض: "A heavy «d»: side of the tongue pressed against the molars."
  ط: "A heavy «t»: the whole tongue pressed to the palate."
  ظ: "A heavy «th» as in «this»: tongue between the teeth, lips rounded."
  ع: "From the middle of the throat: tighten the throat and say «a» with tension."
  غ: A voiced gargled «gh», like French «r». Heavy letter.
  ف: A plain «f».
  ق: A deep «q» with the back of the tongue at the soft palate. Do not confuse with plain «k» (ك).
  ك: A plain light «k».
  ل: A light «l».
  م: A plain «m».
  ن: A plain «n».
  و: Rounded lips, like English «w».
  ه: A light breath, like «h» in «hello».
  ي: Like «y» in «yes».
pair_tips:
- pair: حه
  tip: ح — from the middle of the throat, strong and tense; ه — a light breath from deep in the chest.
- pair: حخ
  tip: ح — a clean breath without rasping; خ — rasping, like gargling.
- pair: ءع
  tip: ع — throat tightened and the sound is held; ء — a short catch, like a pause before «a».
- pair: سص
  tip: ص — heavy (back of the tongue raised); س — light.
- pair: دض
  tip: ض — heavy, side of the tongue against the molars; د — plain «d».
- pair: تط
  tip: ط — heavy, tongue pressed to the palate; ت — light «t».
- pair: ذظ
  tip: ظ — heavy, between the teeth; ذ — light, like «th» in «this».
- pair: ذز
  tip: ذ — tongue between the teeth («th»); ز — plain «z», tongue behind the teeth.
- pair: زظ
  tip: ظ — tongue between the teeth and lips rounded; ز — plain «z».
- pair: ثس
  tip: ث — tongue between the teeth («th» in «think»); س — plain «s».
- pair: قك
  tip: ق — deep, with the back of the tongue; ك — plain «k», further forward.
- pair: خغ
  tip: غ — voiced gargled «gh»; خ — voiceless rasping «kh».
- pair: رغ
  tip: غ — from the throat (like French «r»); ر — with the tip of the tongue.
