vowels:
  َ: фатха (қысқа «а»)
  ِ: кәсра (қысқа «и»)
  ُ: дамма (қысқа «у»)
  ا: мадд — созылыңқы «аа»
  ۦ: мадд — созылыңқы «ии»
  ۥ: мадд — созылыңқы «уу»
  ڇ: қалқала — дыбыстың жеңіл «серпілуі»
letter_tips:
  ء: Тамақта жеңіл тоқтаумен айтылатын қысқа «а».
  ب: Кәдімгі «б».
  ت: "Жіңішке «т»: тілдің ұшы үстіңгі тістерде."
  ث: Тіл ұшы тістердің арасында, ағылшынның «think» сөзіндегі th сияқты.
  ج: Тұтас «дж».
  ح: "Тамақтың ортасынан шығатын терең «х»: тамақты қысып, қырылсыз қатты дем шығар."
  خ: Таңдайдың артынан шығатын қырылды «х». Жуан әріп — «хо».
  د: Кәдімгі «д».
  ذ: Тіл тістердің арасында, ағылшынның «this» сөзіндегі th сияқты.
  ر: Дірілді «р». Фатхамен жуан — «ро».
  ز: Кәдімгі «з».
  س: Кәдімгі жіңішке «с».
  ش: Жіңішке «ш».
  ص: "Жуан «с»: тіл түбі көтерілген, ерін сәл дөңгеленген — «со»."
  ض: "Жуан «д»: тілдің бүйірі азу тістерге басылады — «до»."
  ط: "Жуан «т»: тілдің арқасы таңдайға басылады — «то»."
  ظ: "Жуан тісаралық дыбыс: тіл тістердің арасында, ерін дөңгеленген — «зо»."
  ع: "Тамақтың ортасынан: тамақты қысып, «а»-ны күшпен айт."
  غ: Тамақтан шығатын ұяң «ғ». Жуан әріп — «ғо».
  ف: Кәдімгі «ф».
  ق: Тіл түбімен айтылатын терең «қ» — «қо». Кәдімгі «к»-мен (ك) шатастырма.
  ك: Кәдімгі жіңішке «к».
  ل: Жіңішке «л».
  م: Кәдімгі «м».
  ن: Кәдімгі «н».
  و: Ерін дөңгеленеді, ағылшынның w дыбысы сияқты.
  ه: Жеңіл дем шығару, «һ».
  ي: «йа» сияқты.
pair_tips:
- pair: حه
  tip: ح — тамақтың ортасынан, күшті; ه — кеудеден шығатын жеңіл дем.
- pair: حخ
  tip: ح — қырылсыз таза дем; خ — қырылмен.
- pair: ءع
  tip: ع — тамақ қысылып, дыбыс созылады; ء — қысқа тоқтау.
- pair: سص
  tip: ص — жуан «со»; س — жіңішке «са».
- pair: دض
  tip: ض — жуан, тілдің бүйірі азу тістерге; د — кәдімгі «д».
- pair: تط
  tip: ط — жуан «то»; ت — жіңішке «та».
- pair: ذظ
  tip: ظ — жуан тісаралық «зо»; ذ — жіңішке тісаралық.
- pair: ذز
  tip: ذ — тіл тістердің арасында; ز — кәдімгі «з».
- pair: زظ
  tip: ظ — тіл тістердің арасында, ерін дөңгеленген; ز — кәдімгі «з».
- pair: ثس
  tip: ث — тіл тістердің арасында; س — кәдімгі «с».
- pair: قك
  tip: ق — терең, тіл түбімен («қо»); ك — кәдімгі «к».
- pair: خغ
  tip: غ — ұяң «ғ»; خ — қатаң қырылды «х».
- pair: رغ
  tip: غ — тамақтан; ر — тіл ұшымен.
