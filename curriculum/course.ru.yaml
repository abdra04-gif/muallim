- id: L042
  number: 42
  title: 42. Танвин (1/2)
  kind: line
  accent: ''
  section: tanwin
  part: 4. Ташдид и танвин
  source:
    source_id: SRC-040
    page: 32
    verified: false
  items:
  - id: L042-01
    kind: rule
    text: بًا بٍ بٌ
    name: Танвин — «н» на конце
    tip: 'Двойная огласовка на конце слова — танвин. Она добавляет звук «н»:

      ً = «ан» (обычно с алифом: بًا = бан), ٍ = «ин» (بٍ = бин), ٌ = «ун» (بٌ = бун).

      Буква «н» при этом не пишется — её показывает значок.'
    source:
      source_id: SRC-040
      page: 32
      line: 8
      verified: false
      note: правило — своими словами
