- id: L003
  number: 3
  title: 3. ء · Хамза
  kind: line
  accent: ءأإؤئآ
  section: letter
  part: 2. Буквы и огласовки
  source:
    source_id: SRC-040
    page: 10
    verified: false
  items:
  - id: L003-01
    kind: rule
    text: أَ إِ أُ
    name: 'Три коротких гласных: а, и, у'
    tip: 'Почти все арабские буквы — согласные. Гласный звук показывает маленький значок над буквой или под ней
      — огласовка. Их три: фатха «а», кясра «и», дамма «у».

      Учим каждую отдельно: сначала послушай 🔊, потом скажи сам и отправь голосовое. Все три вместе — только в конце
      урока, когда каждая получается.'
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
      note: правило — своими словами
  - id: L003-02
    kind: rule
    text: ء
    name: Хамза ء — смычка в горле
    tip: 'Хамза — звук из самой глубины горла. Голосовые связки на миг смыкаются и резко размыкаются, как в начале
      «а!» после паузы или в «не-а». В русском этот звук есть, но мы его не замечаем.

      В арабском хамзу произносят всегда, даже в середине слова. Её огласовка — над ней или под ней: أَ — «а», إِ
      — «и», أُ — «у».'
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
      note: правило — своими словами
  - id: L003-03
    kind: rule
    text: أَ
    name: Фатха َ — короткое «а»
    tip: 'Фатха — косая чёрточка НАД буквой. Читается коротким «а».

      Как сказать: открой рот, нижняя челюсть свободно опускается. «Фатх» по-арабски — «открытие».

      Частые ошибки: «э» или «я» вместо «а»; растянутое «аа» — фатха короткая, на один счёт.

      Начни с хамзы: короткая смычка в горле — и сразу «а».'
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
      note: правило — своими словами
  - id: L003-04
    kind: syllable
    text: أَ
    name: Хамза
    sound: а
    tip: Смычка в горле — и сразу короткое «а», рот открыт. Не «я».
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
      note: слог из строки книги — отдельно
  - id: L003-05
    kind: rule
    text: إِ
    name: Кясра ِ — короткое «и»
    tip: 'Кясра — косая чёрточка ПОД буквой. Читается коротким «и».

      Как сказать: челюсть чуть опускается, губы слегка растянуты, как в улыбке. «Каср» — «излом»: голос как будто
      опускается вниз.

      Частые ошибки: «ы» или «е» вместо «и»; «йи» в начале — перед «и» нет «й», только смычка в горле.'
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
      note: правило — своими словами
  - id: L003-06
    kind: syllable
    text: إِ
    name: Хамза
    sound: и
    tip: Смычка в горле — и сразу короткое «и», губы в улыбке. Не «йи» и не «е».
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
      note: слог из строки книги — отдельно
  - id: L003-07
    kind: rule
    text: أُ
    name: Дамма ُ — короткое «у»
    tip: 'Дамма — маленькая «запятая» (как буква و) НАД буквой. Читается коротким «у».

      Как сказать: губы округлены и вытянуты вперёд. «Дамм» — «сжатие»: губы собираются.

      Частая ошибка: «о» вместо «у» — губы расслаблены. Держи их кружком до конца звука.'
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
      note: правило — своими словами
  - id: L003-08
    kind: syllable
    text: أُ
    name: Хамза
    sound: у
    tip: Смычка в горле — и сразу короткое «у», губы кружком. Не «о».
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
      note: слог из строки книги — отдельно
  - id: L003-09
    kind: rule
    text: أَ إِ أُ
    name: Коротко и одинаково ясно
    tip: 'Каждая огласовка длится один счёт (харака) — примерно как быстро согнуть палец. Не тяни её: долгие гласные
      будут позже, в разделе «мадд».

      В русском безударные гласные «съедаются» («молоко» → «малако»). В арабском так нельзя: каждая огласовка звучит
      полностью, ударение её не меняет.

      Теперь прочитай строку книги — все три подряд, каждую отдельно и ясно.'
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
      note: правило — своими словами
  - id: L003-10
    kind: letter
    text: أَ إِ أُ
    name: Хамза
    sound: а · и · у
    tip: Короткое «а» с лёгкой смычкой в горле, как «а» после паузы.
    source:
      source_id: SRC-040
      page: 10
      line: 6
      verified: false
