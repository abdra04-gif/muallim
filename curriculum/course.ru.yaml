  items:
  - id: L053-01
    kind: rule
    text: ٱلْقَمَرُ ٱلشَّمْسُ
    name: 'Артикль ال: лунные и солнечные буквы'
    tip: 'Перед 14 «лунными» буквами ل в артикле читается ясно — над ней сукун: ٱلْقَمَرُ = аль-камару.

      Перед 14 «солнечными» ل не читается, следующая буква удваивается — на ней ташдид: ٱلشَّمْسُ = аш-шамсу.'
