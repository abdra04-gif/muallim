<style>
.w{position:relative;padding:18px 14px max(16px,env(safe-area-inset-bottom));font-family:system-ui,serif;color:var(--tg-theme-text-color);text-align:center}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ar{font:54px/1.4 system-ui,serif}
h3{margin:2px 0 4px;font-size:20px}.h{color:var(--tg-theme-hint-color);font-size:13px}
.st{display:flex;justify-content:center;gap:18px;margin:12px 0}.st b{display:block;font-size:22px}.st span{font-size:12px;color:var(--tg-theme-hint-color)}
button{font:inherit;display:block;width:100%;margin-top:8px;padding:10px;border:0;border-radius:12px;font-weight:700;background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
button.a{background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color)}
</style>
<div class="w"><canvas id="cv" width="320" height="260"></canvas>
<div class="ar">قَرَأْتُ</div><h3>Я прочитал все буквы</h3><div class="h">28 букв с огласовками</div>
<div class="st"><div><b id="a"></b><span>дней серии</span></div><div><b id="b"></b><span>уроков</span></div></div>
<button id="n">Открыть Этап II</button><button class="a" id="s">Поделиться</button></div>
<script>
(function(){
var T=window.TelegramWidget,$=function(i){return document.getElementById(i)},S;
try{S=JSON.parse(T.chatData)}catch(e){}S=S||{k:0,u:0};
$("a").textContent=S.k;$("b").textContent=S.u;
$("n").onclick=function(){T.request("st2").then(function(){},function(){})};
$("s").onclick=function(){T.request("share").then(function(){},function(){})};
var c=$("cv").getContext("2d"),P=[],C=["#E0A94A","#7CC58B","#6FA8DC","#D98880","#B39DDB"],t0=0;
for(var i=0;i<46;i++)P.push({x:160,y:90,vx:(Math.random()-.5)*7,vy:-Math.random()*6-2,c:C[i%5],s:3+Math.random()*4});
function f(t){t0=t0||t;var e=t-t0;c.clearRect(0,0,320,260);
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.16;c.fillStyle=p.c;c.fillRect(p.x,p.y,p.s,p.s)});
if(e<2600)requestAnimationFrame(f);else c.clearRect(0,0,320,260)}
if(!T.isPreview)requestAnimationFrame(f);
})();
</script>
