<style>
.w{--g:light-dark(#176B3A,#6FBF86);--gs:light-dark(#E5F0D8,#26382A);--au:light-dark(#B07D1E,#D9A83F);--on:light-dark(#fff,#10261A);padding:12px 12px max(12px,env(safe-area-inset-bottom));font-family:system-ui,sans-serif;color:var(--tg-theme-text-color);text-align:center}
button{font:inherit;border:0;cursor:pointer;color:inherit;transition:transform .15s}button:active{transform:scale(.95)}
.hd{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tg-theme-hint-color)}.hd b{color:var(--tg-theme-text-color)}

@media (prefers-reduced-motion:reduce){.ph,.end{animation:none}}
</style>
<div class="w"><div class="hd"><b id="t"></b><span id="k"></span></div><div class="dt" id="dt"></div><div id="b"></div><div class="f" id="f"></div></div>

(function(){

btn(fo,"🏠","home");if(S.ok)btn(fo,I[6],"rn","m")}
