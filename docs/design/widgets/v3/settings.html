<style>
.w{--g:light-dark(#176B3A,#6FBF86);--gs:light-dark(#E5F0D8,#26382A);--on:light-dark(#fff,#10261A);padding:12px 12px max(12px,env(safe-area-inset-bottom));font-family:system-ui,sans-serif;color:var(--tg-theme-text-color)}
button{font:inherit;border:0;cursor:pointer;color:inherit;transition:transform .15s}button:active{transform:scale(.96)}
h3{margin:0 0 4px;font-size:16px}
.s{padding:9px 0;border-bottom:1px solid var(--tg-theme-section-separator-color)}.s:last-of-type{border:0}
.s b{display:block;font-size:13.5px;margin-bottom:6px}.s small{display:block;font-size:11.5px;color:var(--tg-theme-hint-color);margin-top:4px}
.seg{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--tg-theme-secondary-bg-color)}
.seg button{flex:1;padding:7px 2px;border-radius:9px;font-size:12.5px;background:none;color:var(--tg-theme-hint-color)}
.seg .on{background:var(--g);color:var(--on);font-weight:700}
.tg{display:flex;justify-content:space-between;align-items:center;width:100%;padding:3px 0;background:none;text-align:left;font-size:13.5px}
.tg i{width:40px;height:23px;border-radius:12px;background:var(--tg-theme-secondary-bg-color);position:relative;flex:none}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:9px;background:var(--tg-theme-hint-color);transition:transform .2s}
.tg.on i{background:var(--g)}.tg.on i::after{transform:translateX(17px);background:var(--on)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.f button{padding:10px 4px;border-radius:12px;background:var(--tg-theme-secondary-bg-color);font-size:12.5px;font-weight:700}
</style>
<div class="w"><h3 id="h"></h3><div id="b"></div><div class="f" id="f"></div></div>
<script>
(function(){
