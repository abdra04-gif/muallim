# Содержание демонстрации уроков (scripts/site/lessons.py → docs/site/build/lessons.html). Правится здесь.
# book — дословно со страниц книги SRC-040; explain_ru/explain_en — объяснения без кириллических примеров звуков
# (черновик агента, утверждает автор); videos — серия «Уроки таджвида» (musulmanin), минуты — полная длина;
# review — вопросы «послушай и выбери», a — номер верного ответа (в боте хранится на сервере, не в виджете).
# annotation — пример очереди учителя (conf — пример уверенности модели, не реальные числа): строки урока 2, flags — номера клеток с ⚠️ (пример ответа модели).
book:
  ء:
    ru: «Хэмзэ» образуется в нижней части гортани.
    en: Hamza is formed in the lower part of the throat.
  ر:
    ru: Образуется, когда передняя часть спинки языка касается передней части верхнего нёба.
    en: Formed when the front of the back of the tongue touches the front of the upper palate.
  ز:
    ru: Образуется при приближении передней части спинки языка к передним зубам. Кончик языка при этом
      касается передних нижних зубов.
    en: Formed when the front of the tongue comes close to the front teeth; the tip touches the lower
      front teeth.
  م:
    ru: Образуется при смыкании губ.
    en: Formed by closing the lips.
  ت:
    ru: Образуется, когда передняя часть спинки языка касается основания передних верхних зубов.
    en: Formed when the front of the tongue touches the base of the upper front teeth.
  ن:
    ru: Образуется, когда передняя часть спинки языка касается верхних дёсен.
    en: Formed when the front of the tongue touches the upper gums.
explain_en:
  vowels: 'Fatha: a short stroke above the letter; a short open vowel, the jaw drops.

    Kasra: a stroke below the letter; a short vowel with lips slightly spread.

    Damma: a small wāw-shaped mark above; a short vowel with rounded lips.

    Each lasts one count. Do not stretch it.'
  ء: 'When alif carries the small hamza ء and a vowel mark, it is read as a short vowel that starts with
    a light catch in the throat: the vocal cords close for a moment and open sharply.'
  ر: Tip of the tongue at the ridge behind the upper teeth. One light tap, do not roll it. With fatha
    and damma ر is heavy; with kasra it is light.
  ز: 'Tip of the tongue at the lower front teeth; the air passes with a buzz. A voiced sound: do not let
    it turn into س.'
  م: Both lips closed, the sound goes through the nose. Close the lips firmly and softly.
  ت: Tip of the tongue at the base of the upper front teeth. A light sound; do not confuse it with the
    heavy ط.
  ن: Tip of the tongue at the ridge behind the upper teeth; the sound goes through the nose.
