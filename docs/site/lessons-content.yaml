rule49:
  ru: Буква ن с «сукуном» и «танвин» сливаются с идущими после них буквами ل и ر без назализации.
  en: Nun with sukun and tanwin merge into a following ل or ر without nasalisation.
rule50:
- title_ru: Полный идгам · ن
  title_en: Full idgham · ن
  arabic:
  - - 'مِّن '
    - 0
  - - رَّ
    - 1
  - - بِّهِمْ
    - 0
  ru: Признаком того, что ن с «сукуном» находится в положении полного «Идгама», является отсутствие «сукуна»
    над ن и наличие «ташдида» над последующей буквой.
  en: 'Sign of full idgham for ن: there is no sukun on ن, and the next letter carries a shadda.'
- title_ru: Полный идгам · танвин
  title_en: Full idgham · tanwin
  arabic:
  - - 'غَفُورًۭا '
    - 0
  - - رَّ
    - 1
  - - حِيمًۭا
    - 0
  ru: Признаком того, что «танвин» находится в положении полного «Идгама», является написание соответствующих
    огласовок одна за другой и наличие «ташдида» над последующей буквой.
  en: 'Sign of full idgham for tanwin: the two vowel marks are written one after the other, and the next
    letter carries a shadda.'
- title_ru: Неполный идгам
  title_en: Partial idgham
  arabic: ن
  ru: Признаком того, что ن с «сукуном» находится в положении неполного «Идгама», является отсутствие
    «сукуна» над ن и отсутствие «ташдида» над последующей буквой. Для «танвина» — огласовки одна за другой
    и нет «ташдида» над последующей буквой.
  en: 'Sign of partial idgham: no sukun on ن and no shadda on the next letter. For tanwin: the vowel marks
    are written one after the other and the next letter has no shadda.'
quiz:
  ru:
    question: 'Вопрос: в مِّن رَّبِّهِمْ над ر есть ташдид?'
    options:
    - Да
    - Нет
    right: 'Верно: над ن нет сукуна, над ر ташдид — полный идгам. Перед ل и ر — без назализации (с. 49).'
    wrong: 'Посмотрите ещё раз: над ر стоит ташдид ّ.'
  en:
    question: 'Question: in مِّن رَّبِّهِمْ, is there a shadda on ر?'
    options:
    - 'Yes'
    - 'No'
    right: 'Right: no sukun on ن, a shadda on ر, so it is full idgham; before ل and ر without nasalisation
      (page 49).'
    wrong: 'Look again: there is a shadda ّ above ر.'
