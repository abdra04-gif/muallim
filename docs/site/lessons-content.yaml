explain_ru:
  vowels: 'Фатха — косая чёрточка над буквой: короткий открытый гласный, челюсть опускается.

    Кясра — чёрточка под буквой: короткий гласный, губы слегка растянуты.

    Дамма — маленький знак в форме و над буквой: короткий гласный, губы округлены.

    Каждая огласовка звучит один счёт — не растягивайте.'
  ء: 'Когда над алифом или под ним стоят маленькая хамза ء и огласовка, он читается коротким гласным,
    который начинается лёгкой смычкой в горле: голосовые связки на миг смыкаются и резко размыкаются.'
  ر: Кончик языка у бугорка за верхними зубами. Один лёгкий удар — не раскатывайте. С фатхой и даммой
    ر твёрдая, с кясрой — мягкая.
  ز: Кончик языка у нижних передних зубов, воздух проходит со звонким свистом. Звук звонкий — не превращайте
    его в س.
  م: Обе губы сомкнуты, звук идёт через нос. Смыкайте губы плотно и мягко.
  ت: Кончик языка у основания верхних передних зубов. Звук лёгкий, язык не прижимается всей спинкой. Не
    путайте с твёрдым ط.
  ن: Кончик языка у бугорка за верхними зубами, звук идёт через нос.
