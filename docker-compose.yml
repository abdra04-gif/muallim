# Имя проекта задано явно: путь к папке на кириллице не подходит для имени compose-проекта.
name: muallim

# Ротация логов (ADR-0027): на сервис не больше 3 × 10 МБ — срок хранения ограничен объёмом
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"   # только локально, наружу не открываем
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  bot:
    build:
      context: .
      args:
        EXTRAS: "--extra ml"
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_FILE: ""   # в Docker логи только в docker logs (ADR-0048): /app не принадлежит пользователю бота
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/audio:/app/data/audio
    profiles: ["bot"]

volumes:
  postgres-data:
